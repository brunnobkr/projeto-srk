<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecionando...</title>
    <script>
      // Redireciona para index.html para permitir que React Router gerencie as rotas
      // Necessário para SPAs no GitHub Pages
      (function() {
        try {
          var path = window.location.pathname;
          var search = window.location.search;
          var hash = window.location.hash;
          
          // Detectar base path automaticamente
          // Se a URL contém /projeto-srk/, o base path é /projeto-srk/
          // Caso contrário, é /
          var pathParts = path.split('/').filter(function(p) { return p && p !== 'index.html' && p !== '404.html'; });
          var basePath = '/';
          
          // Se o primeiro segmento não é um arquivo (não tem extensão), pode ser o nome do repositório
          if (pathParts.length > 0) {
            var firstPart = pathParts[0];
            // Verificar se não é um arquivo (sem extensão) e não é uma rota comum
            if (!firstPart.includes('.') && 
                firstPart !== 'src' && 
                firstPart !== 'assets' && 
                firstPart !== 'public') {
              basePath = '/' + firstPart + '/';
              // Remover o primeiro segmento do pathParts para obter a rota
              pathParts.shift();
            }
          }
          
          // Construir a rota (tudo que vem depois do base path)
          var route = pathParts.join('/');
          
          // Constrói a URL completa para index.html
          var indexPath = basePath + 'index.html';
          
          // Se temos uma rota, manter no pathname para o React Router processar
          if (route) {
            // Usar replaceState para manter a rota no pathname sem recarregar
            var fullPath = basePath + route;
            if (fullPath.endsWith('/')) {
              fullPath = fullPath.slice(0, -1);
            }
            window.history.replaceState(null, '', fullPath + search + hash);
          }
          
          // Carrega o index.html
          window.location.replace(indexPath + search + hash);
        } catch (error) {
          console.error('Erro ao redirecionar:', error);
          // Fallback: redirecionar para a raiz
          window.location.replace('./index.html');
        }
      })();
    </script>
  </head>
  <body>
    <p>Redirecionando...</p>
    <noscript>
      <p>Por favor, habilite JavaScript para acessar o aplicativo.</p>
      <p><a href="./index.html">Clique aqui para ir para a página inicial</a></p>
    </noscript>
  </body>
</html>
