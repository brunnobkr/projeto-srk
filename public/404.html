<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecionando...</title>
    <script>
      // Redireciona para index.html para permitir que React Router gerencie as rotas
      // Necessário para SPAs no GitHub Pages
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        
        // Nome do repositório
        var repoName = 'projeto-srk';
        var basePath = '/' + repoName + '/';
        
        // Remove o base path do path atual
        var route = path.replace(basePath, '').replace(/^\/+/, '').replace(/\/+$/, '');
        
        // Se não tem rota ou é 404.html, vai para a raiz
        if (!route || route === '404.html') {
          route = '';
        }
        
        // Constrói a URL completa
        var indexPath = basePath + 'index.html';
        
        // Redireciona para index.html mantendo a rota no pathname
        // O React Router vai processar a rota corretamente
        if (route) {
          // Mantém a rota no pathname para o React Router processar
          window.history.replaceState(null, '', basePath + route + search + hash);
        }
        
        // Carrega o index.html
        window.location.replace(indexPath + search + hash);
      })();
    </script>
  </head>
  <body>
    <p>Redirecionando...</p>
    <noscript>
      <p>Por favor, habilite JavaScript para acessar o aplicativo.</p>
      <p><a href="/projeto-srk/">Clique aqui para ir para a página inicial</a></p>
    </noscript>
  </body>
</html>
