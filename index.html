<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistema de Controle ITCC - Sumitomo S-riko" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ITCC" />
    <link rel="manifest" href="./manifest.json" />
    <title>Sumitomo S-riko - Controle ITCC</title>
    <script>
      // Proteção inicial antes do React carregar
      (function() {
        'use strict';
        const isDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        if (!isDev) {
          // Desabilitar botão direito
          document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
          });
          
          // Desabilitar seleção
          document.addEventListener('selectstart', function(e) {
            e.preventDefault();
            return false;
          });
          
          // Desabilitar cópia
          document.addEventListener('copy', function(e) {
            e.preventDefault();
            return false;
          });
          
          // Proteção contra F12 e atalhos
          document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key)) ||
                (e.ctrlKey && e.key === 'U')) {
              e.preventDefault();
              return false;
            }
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
